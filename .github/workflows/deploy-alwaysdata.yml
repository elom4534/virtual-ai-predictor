name: Deploy to Alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-alwaysdata
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Controle qualite : le build doit passer avant de toucher au serveur
  # ---------------------------------------------------------------------------
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api-node/package.json

      - name: Install (API Node)
        working-directory: apps/api-node
        run: npm install --no-audit --no-fund

      - name: Build (API Node)
        working-directory: apps/api-node
        run: npm run build

      - name: Tests ML (Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/ml-python/requirements.txt
      - working-directory: apps/ml-python
        run: python -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  # 2. Deploiement SSH sur Alwaysdata (compte elogededivo05417042)
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API + ML + migrations (SSH)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST || 'ssh-elogededivo05417042.alwaysdata.com' }}
          username: ${{ secrets.SSH_USER || 'elogededivo05417042' }}
          key: ${{ secrets.SSH_KEY }}
          # Fallback si pas de cle : decommenter et commenter "key:" au-dessus
          # password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p ~/pred-app ~/www/pred-flutter ~/.config
            cd ~/pred-app
            if [ -d .git ]; then
              git fetch --all && git reset --hard origin/main
            else
              git clone ${{ secrets.GIT_REPO_URL }} . && git reset --hard origin/main
            fi
            # Secrets applicatifs : /home/<account>/.config/pred-app.env (chmod 600)
            # (DATABASE_URL, REDIS_URL, JWT_SECRET, BOOKMAKER_*, MEGAPARI_*,
            #  XBET_*, LIVE_FOOTBALL_API_KEY*)
            bash deploy/install.sh all

  # ---------------------------------------------------------------------------
  # 3. Client Flutter Web (site statique) - optionnel
  # ---------------------------------------------------------------------------
  flutter-web:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Générer les dossiers de plateforme Flutter (absents du dépôt)
        working-directory: apps/client-flutter
        run: |
          # Le zip/repo ne contient QUE lib/ + pubspec.yaml :
          # sans web/, android/, ios/ le build web est impossible.
          flutter create . --platforms=web,android,ios --project-name pred_client --org com.pred

      - name: Build Flutter Web
        working-directory: apps/client-flutter
        run: |
          flutter pub get
          flutter build web --wasm \
            --dart-define=API_BASE=${{ vars.FLUTTER_API_BASE }}

      - name: Deploy vers Alwaysdata (rsync)
        uses: appleboy/rsync-action@v1.1.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: apps/client-flutter/build/web/
          path: ~/www/pred-flutter/
          strip_components: 1
